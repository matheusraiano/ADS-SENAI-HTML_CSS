<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>KaBuM! - Pop Produto</title>
        <link rel="shortcut icon" href="midias/favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="estilo/pop_produtos.css">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
    </head>
    <body>
        <main>
            <section>
                <div class="caixa">
                    <div class="slider">
                        <button id="prevBtn">&#10094</button>
                        <img id="slider-produto" src="">
                        <button id="nextBtn">&#10095</button>
                    </div>
                    <p id="desc-produto"></p>
                    <p id="preco-produto"></p>
                </div>
            </section>
        </main>
        <script>
            function capturarDados(dado) {
                urlParams = new URLSearchParams(window.location.search)
                return urlParams.get(dado);
            }

            document.getElementById("desc-produto").textContent=capturarDados("descricao");
            document.getElementById("preco-produto").textContent=capturarDados("preco");
            const imagens = capturarDados("imagem") ? capturarDados("imagem").split(',') : [];

            let index = 0;

            const sliderImg = document.getElementById("slider-produto");

            function MostrarImagens() {
                if (imagens.length > 0) {
                    sliderImg.src = imagens[index];
                }
            }

            document.getElementById("prevBtn").onclick = function() {
                index = (index - 1 + imagens.length) % imagens.length;
                MostrarImagens();
            }

            document.getElementById("nextBtn").onclick = function() {
                index = (index + 1) % imagens.length;
                MostrarImagens();
            }

            MostrarImagens();
        </script>
    </body>
</html>
